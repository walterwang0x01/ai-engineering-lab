name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消进行中的旧任务，省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 笔记正文来自另一个公开仓库。不拉的话 sync-notes.mjs 会生成空 manifest，
      # 笔记库功能在 CI 里就完全验证不到。sparse-checkout 只取 00-ai 目录。
      - uses: actions/checkout@v4
        with:
          repository: walterwang0x01/tech-learning-and-projects
          path: notes-src
          sparse-checkout: learning-notes/00-ai
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium（组件测试与冒烟测试需要）
        run: pnpm exec playwright install --with-deps chromium

      - name: 格式与 lint
        run: pnpm run lint

      - name: 类型检查
        run: pnpm run check

      # curriculum 的映射门禁要校验 slug 在 manifest 里真实存在，
      # 而 test:unit 不触发 assets:sync，manifest 不会自己出现。
      # 不显式同步的话那批门禁会被 skipIf 跳过，CI 绿了却没校验。
      - name: 同步笔记（curriculum 映射门禁需要 manifest）
        run: pnpm run notes:sync
        env:
          NOTES_SRC: ${{ github.workspace }}/notes-src/learning-notes/00-ai

      - name: 单元与组件测试
        run: pnpm run test:unit
        env:
          # 置位后，manifest 缺失或为空会让门禁硬失败而不是静默跳过
          REQUIRE_NOTES: '1'

      # 子路径部署的 fallback 前缀断言。冒烟测试服务在域名根上，
      # 结构上抓不到这个缺陷，所以单独构建一次子路径产物来校验。
      - name: 子路径部署产物校验
        run: pnpm run build
        env:
          NOTES_SRC: ${{ github.workspace }}/notes-src/learning-notes/00-ai
          BASE_PATH: /ai-engineering-lab

      - name: 全链路冒烟测试
        run: pnpm run test:smoke
        env:
          NOTES_SRC: ${{ github.workspace }}/notes-src/learning-notes/00-ai
