name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消进行中的旧任务，省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium（组件测试与冒烟测试需要）
        run: pnpm exec playwright install --with-deps chromium

      - name: 格式与 lint
        run: pnpm run lint

      - name: 类型检查
        run: pnpm run check

      - name: 单元与组件测试
        run: pnpm run test:unit

      - name: 全链路冒烟测试
        run: pnpm run test:smoke
