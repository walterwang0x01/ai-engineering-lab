name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署串行执行，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 笔记正文来自另一个公开仓库。不拉的话 sync-notes.mjs 会生成空 manifest，
      # 笔记库功能在 CI 里就完全验证不到。sparse-checkout 只取 00-ai 目录。
      - uses: actions/checkout@v4
        with:
          repository: walterwang0x01/tech-learning-and-projects
          path: notes-src
          sparse-checkout: learning-notes/00-ai
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建产物用相对路径，子路径部署无需额外配置
      - name: 构建
        run: pnpm run build
        env:
          NOTES_SRC: ${{ github.workspace }}/notes-src/learning-notes/00-ai

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
