<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>AI Engineering Lab</title>
	<!-- 深色圆角底，与站点 --color-surface-raised 一致 -->
	<rect width="64" height="64" rx="14" fill="#1a1d24" />
	<!--
		对勾对应本项目的核心概念「可判定」：
		答案对错由程序说了算，不是自评。
	-->
	<path
		d="M17 33.5 L27 43 L47 21"
		fill="none"
		stroke="#22d3ee"
		stroke-width="6.5"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<!-- 底部进度条：间隔重复的掌握度推进 -->
	<rect x="17" y="50" width="30" height="4" rx="2" fill="#22d3ee" opacity="0.28" />
	<rect x="17" y="50" width="18" height="4" rx="2" fill="#22d3ee" />
</svg>
