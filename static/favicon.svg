<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>AI Engineering Lab</title>
	<!--
		品牌标记：ReLU 折线加抬起的输出端。

		16px 下细节全部糊掉，所以只保留最可辨认的那一件事——折线的拐点与上扬。
		树突在这个尺寸下是噪点。**没有五官**：曾经存在的拟人化吉祥物组件已删除，
		站内不做拟人化图形，见 AGENTS.md 第 21 条。
		同一形状在 `scripts/generate-og.mjs` 的 brandMark() 里有一份副本。

		实心圆角底而不是透明底：浏览器标签栏在深色与浅色主题下背景相反，
		透明底会让线条在其中一种主题里消失。实心底两种情况都成立。

		底色写死为十六进制而不是 var()：favicon 是独立文档，拿不到站点 token。
		**这是一份手抄副本，所以它由 `src/lib/design/palette.spec.ts` 校验**——
		它必须等于 @theme 里 --color-accent 的 sRGB 值。
		OG 脚本曾经也是这样手抄的，抄的值在收敛后过期了整整一轮没人发现。
	-->
	<rect width="64" height="64" rx="14" fill="#7147dd" />
	<path
		d="M12 48 L28 48 L46 22"
		fill="none"
		stroke="#ffffff"
		stroke-width="7"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<circle cx="47" cy="19" r="9" fill="#ffffff" />
</svg>
